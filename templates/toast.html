{% load static %}
<div
    class="toast-base fixed top-6 right-6 px-6 py-5 rounded-3xl shadow-2xl z-50 opacity-0 -translate-y-6 pointer-events-none transition-all duration-300 flex items-center gap-5"
    id="toast-component"
>
    <div class="toast-icon-wrapper">
        <span id="toast-icon" class="toast-icon"></span>
    </div>
    <div class="toast-copy">
        <h3 class="toast-title" id="toast-title">
            This is a Sample Title
        </h3>
        <p class="toast-message" id="toast-message">
            This is a Sample Message
        </p>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap');

.toast-base {
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    --toast-bg: #2563eb;
    --toast-color: #ffffff;
    --toast-border: rgba(37, 99, 235, 0.35);
    --toast-icon-bg: rgba(255, 255, 255, 0.25);
    --toast-icon-color: #ffffff;
    background: var(--toast-bg);
    color: var(--toast-color);
    border: 2px solid var(--toast-border);
    box-shadow: 0 20px 40px -18px rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(6px);
    max-width: 380px;
    pointer-events: auto;
}

.toast-base.toast-success {
    --toast-bg: #16a34a;
    --toast-border: rgba(22, 163, 74, 0.35);
}

.toast-base.toast-error {
    --toast-bg: #dc2626;
    --toast-border: rgba(220, 38, 38, 0.35);
}

.toast-base.toast-info {
    --toast-bg: #2563eb;
    --toast-border: rgba(37, 99, 235, 0.35);
}

.toast-icon-wrapper {
    background: var(--toast-icon-bg);
    color: var(--toast-icon-color);
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toast-icon {
    display: inline-flex;
    width: 2.25rem;
    height: 2.25rem;
    color: inherit;
}

.toast-icon svg {
    width: 100%;
    height: 100%;
}

.toast-copy {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
}

.toast-title {
    font-weight: 800;
    font-size: 1.125rem;
    letter-spacing: 0.01em;
}

.toast-message {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.45;
    opacity: 0.92;
}
</style>
<script>
  (function() {
    if (typeof window.showToast === 'function') {
      return;
    }

    window.showToast = function(title, message, type = 'info', duration = 3200) {
      const toastComponent = document.getElementById('toast-component');
      const toastTitle = document.getElementById('toast-title');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      if (!toastComponent || !toastTitle || !toastMessage || !toastIcon) {
        return;
      }

      const hiddenClasses = ['opacity-0', '-translate-y-6', 'pointer-events-none'];
      const visibleClasses = ['opacity-100', 'translate-y-0'];
      const typeKey = ['success', 'error', 'info'].includes(type) ? type : 'info';
      const icons = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15 9 9 15"></path><path d="M9 9l6 6"></path></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>',
      };

      toastComponent.classList.remove('toast-success', 'toast-error', 'toast-info');
      toastComponent.classList.add(`toast-${typeKey}`);

      toastTitle.textContent = title;
      toastMessage.textContent = message;
      toastIcon.innerHTML = icons[typeKey];

      toastComponent.classList.remove(...hiddenClasses);
      toastComponent.classList.add(...visibleClasses);

      const previousTimeoutId = toastComponent.dataset.timeoutId;
      if (previousTimeoutId) {
        clearTimeout(Number(previousTimeoutId));
      }

      const timeoutId = window.setTimeout(() => {
        toastComponent.classList.remove(...visibleClasses);
        toastComponent.classList.add(...hiddenClasses);
      }, duration);

      toastComponent.dataset.timeoutId = String(timeoutId);
    };
  })();
</script>

<script>
  if (typeof window.showToast !== 'function') {
    window.showToast = function(title, message, type = 'info') {
      console.warn('Toast component unavailable. Falling back to alert.', { title: title, message: message, type: type });
      if (typeof window.alert === 'function') {
        if (message) {
          alert((title ? title + '\n' : '') + message);
        } else if (title) {
          alert(title);
        }
      }
    };
  }
</script>
