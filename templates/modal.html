<!-- templates/modal.html -->
<div id="productModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50 px-4">
  <div id="productModalContent" class="bg-white rounded-lg shadow-xl w-full max-w-xl">
    <div class="flex items-center justify-between p-5 border-b">
      <div>
        <h3 id="productModalTitle" class="text-xl font-semibold text-gray-900">Add Product</h3>
        <p class="text-sm text-gray-600 mt-1">Showcase your soccer gear with the community</p>
      </div>
      <button type="button" class="text-gray-400 hover:text-gray-900" data-close-product-modal>
        <span class="sr-only">Close modal</span>
        &times;
      </button>
    </div>

    <form id="productForm" class="px-6 py-5 space-y-4">
      <div id="productFormErrors" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded px-3 py-2"></div>
      <input type="hidden" id="product-id" name="product_id">

      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
        <input type="text" id="name" name="name" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required>
      </div>

      <div>
        <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
        <input type="number" id="price" name="price" min="0" step="1" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
        <textarea id="description" name="description" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
          <select id="category" name="category" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required>
            <option value="">Choose a category</option>
            <option value="shoes">Shoes</option>
            <option value="socks">Socks</option>
            <option value="shirt">Shirt</option>
            <option value="pants">Pants</option>
            <option value="jacket">Jacket</option>
          </select>
        </div>
        <div>
          <label for="thumbnail" class="block text-sm font-medium text-gray-700">Thumbnail URL</label>
          <input type="url" id="thumbnail" name="thumbnail" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="rating" class="block text-sm font-medium text-gray-700">Rating</label>
          <input type="number" id="rating" name="rating" min="1" max="5" step="0.1" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required>
        </div>
        <div>
          <label for="stock" class="block text-sm font-medium text-gray-700">Stock</label>
          <input type="number" id="stock" name="stock" min="0" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required>
        </div>
      </div>

      <label class="inline-flex items-center">
        <input id="is_featured" name="is_featured" type="checkbox" class="w-4 h-4 text-green-600 border-gray-300 rounded">
        <span class="ml-2 text-sm text-gray-700">Featured Product</span>
      </label>
    </form>

    <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
      <button type="button" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition" data-close-product-modal>Cancel</button>
      <button type="submit" form="productForm" id="productModalSubmit" class="order-1 sm:order-2 flex-1 bg-green-600 text-white px-6 py-3 rounded-md font-medium hover:bg-green-700 transition">Save Product</button>
    </div>
  </div>
</div>

<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50 px-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
    <div class="p-6 border-b">
      <h3 class="text-lg font-semibold text-gray-900">Delete product?</h3>
      <p id="deleteModalMessage" class="mt-2 text-sm text-gray-600"></p>
    </div>
    <div class="flex flex-col sm:flex-row gap-4 p-6">
      <button type="button" id="cancelDeleteButton" class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition">Cancel</button>
      <button type="button" id="confirmDeleteButton" class="order-1 sm:order-2 flex-1 bg-red-600 text-white px-6 py-3 rounded-md font-medium hover:bg-red-700 transition">Delete</button>
    </div>
  </div>
</div>
