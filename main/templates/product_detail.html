{% extends 'base.html' %}
{% load static %}

{% block meta %}
<title>Product Detail - Product</title>
{% endblock meta %}

{% block content %}
<div class="bg-gray-50 w-full min-h-screen">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-6">
            <a href="{% url 'main:show_main' %}" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">
                ← Back to Product List
            </a>
        </div>
        
        <div id="loading-state" class="bg-white rounded-lg border border-gray-200 p-12 text-center">
            <svg class="animate-spin h-8 w-8 text-green-600 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <p class="text-gray-600 mt-3">Loading product detail...</p>
        </div>

        <div id="error-state" class="bg-white rounded-lg border border-gray-200 p-12 text-center hidden">
            <div class="w-16 h-16 mx-auto mb-4">
                <div class="text-red-500 text-5xl">⚠️</div>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">Failed to load product</h3>
            <p class="text-gray-500">Please try again later.</p>
        </div>
        
        <article id="article-description" class="bg-white rounded-lg border border-gray-200 overflow-hidden hidden">
            
            <div class="p-6 sm:p-8">
                <div id="badges-container" class="flex flex-wrap items-center gap-2 mb-4">
                </div>
                
                <h1 id="article-name" class="text-3xl sm:text-4xl font-bold text-gray-900 leading-tight mb-4">
                </h1>
                
                <div class="flex flex-wrap items-center text-sm text-gray-500 gap-4">
                    <span id="article-price">
                    </span>
                    <span id="article-stock">
                    </span>
                    <span id="article-rating">
                    </span>
                </div>
            </div>

            <div id="featured-image-container" class="px-6 sm:px-8 hidden">
                <img id="featured-image" 
                     src="" 
                     alt="" 
                     class="w-full h-64 sm:h-80 lg:h-96 object-cover rounded-lg">
            </div>

            <div class="p-6 sm:p-8">
                <div class="prose prose-lg max-w-none">
                    <div id="article-description-text" class="text-gray-700 leading-relaxed whitespace-pre-line text-base sm:text-lg">
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-200 p-6 sm:p-8 bg-gray-50">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-medium text-gray-900">
                            <p id="article-seller">Seller: Loading...</p>
                        </div>
                        <p class="text-sm text-gray-500">Seller</p>
                    </div>
                </div>
            </div>
        </article>
    </div>
</div>

<script>
// ===== Config =====
const PRODUCT_ID = "{{ product.id }}";
const PRODUCT_DETAIL_ENDPOINT =
  `{% url 'main:show_json_by_id' '00000000-0000-0000-0000-000000000000' %}`.replace('00000000-0000-0000-0000-000000000000', PRODUCT_ID);

// ===== DOM =====
const loadingState = document.getElementById('loading-state');
const errorState   = document.getElementById('error-state');
const articleCard  = document.getElementById('article-description');

const badgesContainer = document.getElementById('badges-container');
const titleEl   = document.getElementById('article-name');
const priceEl   = document.getElementById('article-price');
const stockEl   = document.getElementById('article-stock');
const ratingEl  = document.getElementById('article-rating');

const featuredImageContainer = document.getElementById('featured-image-container');
const featuredImage = document.getElementById('featured-image');

const descEl    = document.getElementById('article-description-text');
const sellerEl  = document.getElementById('article-seller');

// ===== Helpers =====
function showState(state) {
  loadingState.classList.toggle('hidden', state !== 'loading');
  errorState.classList.toggle('hidden', state !== 'error');
  articleCard.classList.toggle('hidden', state !== 'ready');
}

function getCategoryLabel(code) {
  const map = { shoes:'Shoes', socks:'Socks', shirt:'Shirt', pants:'Pants', jacket:'Jacket' };
  return map[code] || code;
}

function formatRupiah(n) {
  try { return new Intl.NumberFormat('id-ID').format(Number(n)); }
  catch { return n; }
}

// ===== Render =====
function renderProduct(p) {
  // Title
  titleEl.textContent = p.name;
  document.title = `${p.name} - I Wear Soccer Product`;

  // Badges
  badgesContainer.innerHTML = '';
  const cat = document.createElement('span');
  cat.className = 'inline-flex items-center px-3 py-1 rounded-md text-xs font-medium bg-green-600 text-white';
  cat.textContent = getCategoryLabel(p.category);
  badgesContainer.appendChild(cat);

  if (p.is_featured) {
    const feat = document.createElement('span');
    feat.className = 'inline-flex items-center px-3 py-1 rounded-md text-xs font-medium bg-yellow-100 text-yellow-800';
    feat.textContent = 'Featured';
    badgesContainer.appendChild(feat);
  }
  if (Number(p.purchase_count) > 500) {
    const hot = document.createElement('span');
    hot.className = 'inline-flex items-center px-3 py-1 rounded-md text-xs font-medium bg-red-100 text-red-800';
    hot.textContent = 'Hot';
    badgesContainer.appendChild(hot);
  }

  // Meta
  priceEl.textContent  = `Rp${formatRupiah(p.price)}`;
  stockEl.textContent  = `Stock: ${p.stock}`;
  ratingEl.textContent = `Rating: ${p.rating}`;

  // Image
  if (p.thumbnail) {
    featuredImage.src = p.thumbnail;
    featuredImage.alt = p.name;
    featuredImageContainer.classList.remove('hidden');
  } else {
    featuredImageContainer.classList.add('hidden');
  }

  // Description & seller
  descEl.textContent = p.description || '';
  sellerEl.textContent = `Seller: ${p.user_username || 'Anonymous'}`;
}

// ===== Fetch =====
async function loadProductDetail() {
  try {
    showState('loading');
    const res = await fetch(PRODUCT_DETAIL_ENDPOINT, {
      headers: { 'Accept': 'application/json' },
      credentials: 'same-origin',
    });
    if (!res.ok) throw new Error('Failed to fetch product detail');
    const data = await res.json();
    renderProduct(data);
    showState('ready');
  } catch (err) {
    console.error(err);
    showState('error');
  }
}

loadProductDetail();
</script>

{% endblock content %}
